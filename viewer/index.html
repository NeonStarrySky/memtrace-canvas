<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内存读取轨迹</title>
<style>
  :root { color-scheme: dark; font: 15px/1.5 system-ui, sans-serif; background: #0b111a; color: #edf5fc; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1120px; margin: auto; padding: 36px 24px; }
  h1, h2, p, dl, dd { margin: 0; }
  h1 { font-size: clamp(27px, 5vw, 38px); letter-spacing: -.04em; }
  h2 { font-size: 16px; }
  header, .controls, .bounds { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; }
  header { margin-bottom: 18px; }
  .status, dt { color: #a1b4c8; font-size: 13px; }
  .status[data-state="error"] { color: #ffbf95; }
  .panel { background: #111b28; border: 1px solid #2a3b4c; border-radius: 12px; padding: 14px; }
  .setup { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 12px; margin-bottom: 12px; }
  form { display: grid; gap: 9px; margin-top: 10px; }
  label, summary, small { color: #a1b4c8; font-size: 13px; }
  summary { cursor: pointer; }
  .field { display: grid; gap: 4px; min-width: 0; }
  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .inline { display: flex; align-items: center; gap: 6px; }
  .inline input { min-width: 0; flex: 1; }
  input, textarea, select { width: 100%; border: 1px solid #3b5065; border-radius: 6px; padding: 6px 8px; background: #0b1520; color: inherit; font: inherit; font-size: 13px; }
  textarea { resize: vertical; }
  :focus-visible { outline: 2px solid #66efd8; outline-offset: 2px; }
  .form-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #start { color: #082723; font-weight: 700; background: #66efd8; border-color: #66efd8; }
  .form-status { color: #ffbf95; font-size: 13px; overflow-wrap: anywhere; }
  .form-status:empty, #active-target:empty { display: none; }
  #active-target { color: #a1b4c8; font-size: 13px; overflow-wrap: anywhere; }
  #detected-modules { display: flex; flex-wrap: wrap; gap: 6px 13px; padding-top: 6px; }
  #detected-modules label { display: inline-flex; align-items: center; gap: 4px; overflow-wrap: anywhere; }
  #detected-modules input { width: auto; accent-color: #66efd8; }
  .controls { justify-content: flex-start; margin-bottom: 12px; }
  .zoom-controls { display: inline-flex; align-items: center; gap: 6px; }
  #zoom-level, #range-kind { color: #a1b4c8; font-size: 12px; }
  #zoom-level { min-width: 5ch; text-align: center; font-variant-numeric: tabular-nums; }
  button { border: 1px solid #3b5065; border-radius: 6px; background: #192738; color: inherit; font: inherit; padding: 5px 10px; cursor: pointer; }
  button:hover, button:focus-visible { border-color: #66efd8; }
  button:disabled { opacity: .48; cursor: default; }
  .bounds { font: 13px ui-monospace, monospace; color: #a1b4c8; overflow-wrap: anywhere; }
  canvas { display: block; width: 100%; height: clamp(210px, 48vw, 460px); margin: 8px 0; outline: 1px solid #2a3b4c; border-radius: 6px; background: #080f18; }
  #plot[data-interactive="true"] { touch-action: none; }
  #plot[data-pannable="true"] { cursor: grab; }
  #plot[data-pannable="true"][data-dragging="true"] { cursor: grabbing; }
  .metrics { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 20px; }
  dd { color: #66efd8; font: 16px ui-monospace, monospace; overflow-wrap: anywhere; }
  #point { margin-top: 10px; min-height: 1.5em; color: #c1d4e6; font: 13px/1.5 ui-monospace, monospace; overflow-wrap: anywhere; }
  dialog { width: min(580px, calc(100% - 24px)); color: inherit; }
  dialog::backdrop { background: #030912ab; }
  #folder-items { margin-top: 10px; max-height: min(55vh, 420px); overflow: auto; display: grid; gap: 3px; }
  #folder-items button { text-align: left; overflow-wrap: anywhere; }
  @media (max-width: 720px) { .setup { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 540px) { main { padding: 22px 12px; } }
</style>

<main>
  <header>
    <h1>内存读取轨迹</h1>
    <p id="status" class="status" role="status">正在连接本地采集器</p>
  </header>
  <div class="setup">
    <section class="panel" aria-labelledby="launch-title">
      <h2 id="launch-title">启动程序</h2>
      <form id="launch-form">
        <div class="field">
          <label for="program">可执行文件</label>
          <div class="inline"><input id="program" placeholder="本机绝对路径" required autocomplete="off"><button id="browse" type="button">浏览</button></div>
        </div>
        <div class="field">
          <label for="cwd">工作目录</label>
          <div class="inline"><input id="cwd" placeholder="默认使用可执行文件所在目录" autocomplete="off"><button id="browse-cwd" type="button">浏览目录</button></div>
        </div>
        <label class="field">程序参数（每行一个）<textarea id="args" rows="2" autocomplete="off"></textarea></label>
        <div class="form-actions">
          <button id="start" type="submit">启动并监测</button>
          <button id="stop" type="button" disabled>停止程序</button>
        </div>
        <p id="active-target"></p>
        <p id="launch-error" class="form-status" role="status"></p>
      </form>
    </section>
    <section class="panel" aria-labelledby="filter-title">
      <h2 id="filter-title">筛选读取与跳转</h2>
      <form id="filter-form">
        <div class="field">
          <label for="modules">发起读取的模块</label>
          <div class="inline"><input id="modules" name="modules" placeholder="例如 Engine.exe, glfw3.dll" autocomplete="off"><button id="only-main" type="button" disabled>仅主程序</button></div>
          <details id="module-choices" hidden><summary>已检测到的模块</summary><div id="detected-modules"></div></details>
        </div>
        <label class="field">线程 ID<input name="threads" placeholder="例如 7028, 9012" autocomplete="off"></label>
        <div class="pair">
          <label class="field">起始读地址<input name="minAddress" placeholder="0x…" autocomplete="off"></label>
          <label class="field">结束读地址<input name="maxAddress" placeholder="0x…" autocomplete="off"></label>
        </div>
        <div class="pair">
          <label class="field">最小跳距（字节）<input name="minJump" inputmode="numeric" autocomplete="off"></label>
          <label class="field">最大跳距（字节）<input name="maxJump" inputmode="numeric" autocomplete="off"></label>
        </div>
        <label class="field">跳距计算<select name="basis"><option value="adjacent">同线程实际相邻读取</option><option value="filtered">筛选后的同线程读取</option></select></label>
        <div class="form-actions"><button type="submit">应用筛选</button><button id="clear-filter" type="button">清空</button><small>同类选项取其一，不同条件同时满足。</small></div>
        <p id="filter-error" class="form-status" role="status"></p>
      </form>
    </section>
  </div>
  <section class="panel" aria-label="虚拟地址点图">
    <div class="controls">
      <button id="fit-all" type="button" disabled>适配全部</button>
      <button id="fit-recent" type="button" disabled>适配近期</button>
      <div class="zoom-controls" role="group" aria-label="缩放">
        <button id="zoom-out" type="button" aria-label="缩小" disabled>−</button>
        <output id="zoom-level" aria-label="缩放倍率" aria-live="off">100%</output>
        <button id="zoom-in" type="button" aria-label="放大" disabled>+</button>
      </div>
    </div>
    <div class="bounds"><span id="range-start">—</span><span id="range-kind">地址范围</span><span id="range-end">—</span></div>
    <canvas id="plot" role="img" aria-label="按虚拟地址从左到右、从上到下绘制的读取点"></canvas>
    <p id="point">等待第一次读取</p>
    <dl class="metrics">
      <div><dt>已采集读取</dt><dd id="raw-total">0</dd></div>
      <div><dt>匹配读取</dt><dd id="total">0</dd></div>
      <div><dt id="span-label">显示跨度</dt><dd id="span">—</dd></div>
      <div><dt>最新步长（同线程）</dt><dd id="stride">—</dd></div>
      <div><dt>平均跳距（同线程）</dt><dd id="mean">—</dd></div>
    </dl>
  </section>
</main>
<dialog id="file-dialog" class="panel" aria-labelledby="file-title">
  <header><h2 id="file-title">选择可执行文件</h2><button id="file-close" type="button">关闭</button></header>
  <form id="folder-form">
    <label class="field">当前目录<input id="folder-path" autocomplete="off"></label>
    <div class="form-actions"><button type="submit">打开目录</button><button id="folder-parent" type="button">上一级</button><button id="folder-home" type="button">主目录</button><button id="folder-select" type="button" hidden>选择此目录</button></div>
    <p id="folder-error" class="form-status" role="status"></p>
  </form>
  <div id="folder-items"></div>
</dialog>
<script type="module" src="/viewer.mjs"></script>
</html>
